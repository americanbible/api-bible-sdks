name: Contract (live api.bible)

# Live schema-drift detector. Hits the real API and fails if a response no
# longer matches the SDKs' response schemas (TypeScript Zod / Python Pydantic).
# Runs nightly (and on demand) rather than in PR CI so network flakiness never
# blocks a merge. Requires the BIBLE_API_KEY repository secret; without it the
# live tests self-skip.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:contract:live
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}

  python-live-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -m live tests/contract/test_contract_live.py
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
