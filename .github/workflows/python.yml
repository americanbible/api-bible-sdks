name: Python

# Deliberately not path-filtered, matching ci.yml. These jobs are required
# status checks on `main`, and a filtered workflow simply does not report on a
# PR outside its paths — GitHub then waits forever for a context that will never
# arrive, blocking the PR permanently. The suite runs in well under a minute, so
# always running it is cheaper than the failure mode.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Pin the dev toolchain to the committed lockfile for reproducible runs.
      - run: pip install -e ".[dev]" -c requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=api_bible

  # Named `audit-pip`, not `audit`, so the status-check context stays distinct
  # from ci.yml's audit job. See the note there.
  audit-pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      # Fail the build on any known vulnerability in the locked dependency set.
      - run: pip-audit -r requirements-dev.txt
