name: Python

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/python/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Pin the dev toolchain to the committed lockfile for reproducible runs.
      - run: pip install -e ".[dev]" -c requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=api_bible

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      # Fail the build on any known vulnerability in the locked dependency set.
      - run: pip-audit -r requirements-dev.txt
