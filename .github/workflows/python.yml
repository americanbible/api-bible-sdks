name: Python

# Deliberately not path-filtered, matching ci.yml. These jobs are required
# status checks on `main`, and a filtered workflow simply does not report on a
# PR outside its paths — GitHub then waits forever for a context that will never
# arrive, blocking the PR permanently. The suite runs in well under a minute, so
# always running it is cheaper than the failure mode.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Always use the interpreter setup-python installed; never let uv fetch one.
  UV_PYTHON_DOWNLOADS: never

defaults:
  run:
    working-directory: packages/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      # Install the project and the locked dev toolchain (uv.lock) into .venv.
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=api_bible

  # The test matrix runs the lockfile pins. These jobs test the edges of the
  # ranges pyproject.toml declares instead: the oldest versions a user can
  # resolve (on the oldest Python) and the newest (on the newest Python). Test
  # tools stay on their lockfile pins, so a failure here is about httpx or
  # pydantic, not the toolchain. If `lowest-direct` fails, raise the floor in
  # pyproject.toml rather than pinning around it.
  deps:
    name: deps (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: lowest-direct
            python: '3.10'
          - resolution: highest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      - run: >-
          uv pip install --system --resolution ${{ matrix.resolution }} -e .
          $(uv export --locked --only-group dev --no-emit-project --no-hashes | grep -E '^(pytest|pytest-cov)==')
      - run: python -c "import httpx, pydantic; print('httpx', httpx.__version__, '| pydantic', pydantic.VERSION)"
      - run: pytest

  # Named `audit-pip`, not `audit`, so the status-check context stays distinct
  # from ci.yml's audit job. See the note there.
  audit-pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      # pip-audit itself comes from the lock (the `release` dependency group).
      - run: uv sync --locked --only-group release --python 3.12
      # Fail the build on any known vulnerability in the locked dependency set:
      # runtime deps, the dev toolchain and the release tools.
      - run: uv export --locked --all-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
      - run: .venv/bin/pip-audit -r "$RUNNER_TEMP/requirements.txt"
