name: React Release

# Publishes @americanbible/api-bible-sdk-react to npm when a tag matching
# `react-v*` is pushed (e.g. `react-v1.0.0`). Uses npm Trusted Publishing (OIDC)
# — no long-lived npm token is stored in the repo — and ships provenance so the
# package page links back to this build. The tag must match the version in
# packages/react/package.json.
#
# Two jobs, so third-party dev tooling never runs next to publish rights:
#   build   — no OIDC token. Installs the full dev toolchain, runs the gate
#             (lint, typecheck, test, build), checks the packed tarball
#             (publint, attw, install smoke test), and uploads it.
#   publish — holds `id-token: write`. Checks out nothing and installs nothing
#             but npm itself; publishes the exact tarball `build` verified,
#             with lifecycle scripts disabled.
#
# Prerelease versions (a hyphen in the version, e.g. `1.0.0-beta.1`) publish
# under the `next` dist-tag so a bare `npm install …-react` never resolves a
# beta; stable versions go to `latest`.
#
# One-time setup: npm only lets you configure a trusted publisher for a package
# that already exists, so the first version is published by hand — see
# packages/react/RELEASING.md, "First publish (one-time)".
#
# Actions are pinned to commit SHAs (a tag can be moved; a SHA cannot).
# Dependabot's github-actions updates keep the pins and `# vX` comments current.

on:
  push:
    tags:
      - 'react-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      disttag: ${{ steps.disttag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#react-v}"
          version="$(node -p "require('./packages/react/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag react-v$tag does not match package version $version"
            exit 1
          fi
      - name: Determine dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./packages/react/package.json').version")"
          # A hyphen marks a prerelease (1.0.0-beta.1) → publish under `next`, not
          # `latest`, so `npm install …-react` never grabs a beta by default.
          # Pure-shell glob match — no dependence on grep's handling of a `-` pattern.
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # The React SDK resolves the core from its gitignored dist/, so build the
      # core before the React gate.
      - run: npm run build -w @americanbible/api-bible-sdk
      - run: npm run lint -w @americanbible/api-bible-sdk-react
      - run: npm run typecheck -w @americanbible/api-bible-sdk-react
      - run: npm test -w @americanbible/api-bible-sdk-react
      - run: npm run build -w @americanbible/api-bible-sdk-react
      - run: npm run check:package -w @americanbible/api-bible-sdk-react
      - name: Pack
        id: pack
        run: |
          file="$(npm pack -w @americanbible/api-bible-sdk-react --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          echo "tarball=$file" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the tarball (React 19)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SMOKE_REACT_VERSION: '19'
        run: node packages/react/scripts/smoke-test.mjs "$TARBALL"
      - name: Smoke-test the tarball (React 18)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SMOKE_REACT_VERSION: '18'
        run: node packages/react/scripts/smoke-test.mjs "$TARBALL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing + provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-tarball
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing requires npm >= 11.5.1; Node 20 ships npm 10. Pinned
      # to the 11 line rather than @latest — see the note in
      # typescript-release.yml; npm 12 requires Node >= 22.22 and fails here.
      - run: npm install -g npm@11
      # --ignore-scripts: the gate already ran in `build`; nothing from the
      # package's own scripts runs while the OIDC token is available.
      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.disttag }}
        run: npm publish "./$TARBALL" --provenance --access public --tag "$DIST_TAG" --ignore-scripts
