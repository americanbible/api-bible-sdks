name: Python Release

# Publishes americanbible-api-bible-sdk to PyPI when a tag matching `py-v*` is
# pushed (e.g. `py-v1.0.1`). Uses PyPI Trusted Publishing (OIDC) — no
# long-lived API token is stored in the repo. The tag must point at a commit on
# main and match the version in src/api_bible/_version.py.
#
# Two jobs, so dev tooling never runs next to publish rights (as in
# react-release.yml):
#   build   — no OIDC token. Runs the gate (lint, format, types, tests,
#             pip-audit), builds the wheel and sdist, checks their metadata
#             with twine, smoke-tests the wheel in a clean venv, and uploads
#             them.
#   publish — holds `id-token: write`. Uploads the exact files `build`
#             verified. Runs only for a tag push.
#
# Dry run: start this workflow by hand (Actions → Python Release → Run
# workflow) to run `build` on the real runner without publishing anything.

on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/python

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag can point at any commit, including one on an unmerged branch.
      # Only publish code that has been merged to main.
      - name: Verify the tagged commit is on main
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" build==1.6.1 -c requirements-dev.txt
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          version="$(python -c 'from api_bible._version import __version__; print(__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag py-v$tag does not match package version $version"
            exit 1
          fi
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=api_bible
      # Fail the release on any known vulnerability in the locked dependency set
      # — a CVE may have been disclosed after the gating merge but before this tag.
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-dev.txt
      - run: python -m build
      # PyPI freezes a version's metadata and README forever, so catch rendering
      # problems before the upload rather than after.
      - run: python -m pip install twine==7.0.0
      - run: twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean venv
        run: |
          expected="$(python -c 'from api_bible._version import __version__; print(__version__)')"
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          # Run from outside the checkout so the import resolves to the wheel.
          cd "$RUNNER_TEMP"
          EXPECTED="$expected" "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import os
          import pathlib

          import api_bible

          assert api_bible.__version__ == os.environ["EXPECTED"], api_bible.__version__
          assert (pathlib.Path(api_bible.__file__).parent / "py.typed").exists(), "py.typed missing"
          api_bible.BibleClient("k").close()
          print(f"smoke ok: {api_bible.__version__} from {api_bible.__file__}")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: packages/python/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      # Pinned by SHA like every action here: this step holds the OIDC token
      # that can publish to PyPI, so a moved tag or branch must not change it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
