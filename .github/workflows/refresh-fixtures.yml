name: Refresh Contract Fixtures

# Re-records the offline contract fixtures (tests/contract/fixtures/recordings.json)
# from live api.bible so they don't drift from the API. The nightly Contract
# workflow *detects* drift; this one *fixes* it. Runs monthly and on demand, and
# opens a PR with any changes for review — fixtures are test inputs, so
# auto-committing them could quietly mask a real regression.
#
# The PR it opens needs one manual click before it can merge. GitHub does not
# let events raised with GITHUB_TOKEN start new workflow runs (loop prevention),
# so the PR's checks sit at "action_required" until a maintainer approves them:
# Actions tab -> the queued run -> "Approve and run". Dependabot is exempt from
# this; github-actions[bot] is not. The PR is assigned so it does not go unseen
# waiting for that click — the first monthly run sat unnoticed for eight days.
#
# This is a discoverability cost, not a verification gap: the validate step below
# already runs the full contract tier plus the leak guard before anything is
# pushed, so the PR's CI is a second run of checks that have already passed.

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open the PR
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Re-record fixtures from live api.bible
        run: npm run record-fixtures
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
      # Two guards before anything is pushed. The offline tier must replay the
      # freshly captured fixtures cleanly — a failure means the API changed in a
      # way the SDK schemas don't accept, which needs a code fix rather than a
      # fixture refresh. And the leak guard must pass: sanitizeBody strips
      # credentials at record time, but if api.bible starts returning one under a
      # field it doesn't know about, this is what stops it reaching a pushed
      # branch on a public repo rather than catching it a step later on the PR.
      # The whole directory runs so any guard added later is covered too.
      # BIBLE_API_KEY is deliberately out of scope here, so the key-gated live
      # tier self-skips and only the offline tests run.
      - name: Validate the recorded fixtures (replay + leak guard)
        run: npm test -- tests/contract/
      - name: Open a PR if fixtures changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Who to assign the PR to, so it does not sit unseen. Override with
          # `gh variable set FIXTURE_REVIEWER --body <user>`.
          FIXTURE_REVIEWER: ${{ vars.FIXTURE_REVIEWER }}
        run: |
          if git diff --quiet -- tests/contract/fixtures; then
            echo "Fixtures unchanged — nothing to do."
            exit 0
          fi
          branch="chore/refresh-contract-fixtures-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tests/contract/fixtures
          git commit -m "test(typescript): refresh contract fixtures from live api.bible"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --assignee "${FIXTURE_REVIEWER:-mjvinti}" \
            --title "test(typescript): refresh contract fixtures" \
            --body "**This PR needs one click before its checks will run.** Go to the Actions tab, open the queued run for this branch, and choose *Approve and run*. GitHub does not let a PR opened with \`GITHUB_TOKEN\` start its own workflow runs, so the checks stay at \`action_required\` until a maintainer approves them.

          Automated refresh of the offline contract fixtures from live api.bible. The recording was already validated in the run that produced it — the offline contract tier replays cleanly and the leak guard found no credentials — so approving CI re-runs checks that have passed once already.

          Review the diff for intentional API changes vs. regressions before merging. Timestamp-only churn (\`updatedAt\`, \`expiresAt\`) is normal; a changed \`resourceUrl\` or any added token is not."

  refresh-python:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open the PR
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" -c requirements-dev.txt
      - name: Re-record fixtures from live api.bible
        run: python tests/contract/record_fixtures.py
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
      # Same two guards as the TypeScript job: the offline tier must replay the
      # freshly captured fixtures cleanly, and the leak guard must pass so a
      # credential the sanitizer doesn't recognize never reaches a pushed branch
      # on a public repo. See the note in the `refresh` job above.
      - name: Validate the recorded fixtures (replay + leak guard)
        run: pytest tests/contract/
      - name: Open a PR if fixtures changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See the note in the `refresh` job above.
          FIXTURE_REVIEWER: ${{ vars.FIXTURE_REVIEWER }}
        run: |
          if git diff --quiet -- tests/contract/fixtures; then
            echo "Fixtures unchanged — nothing to do."
            exit 0
          fi
          branch="chore/refresh-python-contract-fixtures-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tests/contract/fixtures
          git commit -m "test(python): refresh contract fixtures from live api.bible"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --assignee "${FIXTURE_REVIEWER:-mjvinti}" \
            --title "test(python): refresh contract fixtures" \
            --body "**This PR needs one click before its checks will run.** Go to the Actions tab, open the queued run for this branch, and choose *Approve and run*. GitHub does not let a PR opened with \`GITHUB_TOKEN\` start its own workflow runs, so the checks stay at \`action_required\` until a maintainer approves them.

          Automated refresh of the offline contract fixtures from live api.bible. The recording was already validated in the run that produced it — the offline contract tier replays cleanly and the leak guard found no credentials — so approving CI re-runs checks that have passed once already.

          Review the diff for intentional API changes vs. regressions before merging. Timestamp-only churn (\`updatedAt\`, \`expiresAt\`) is normal; a changed \`resourceUrl\` or any added token is not."
