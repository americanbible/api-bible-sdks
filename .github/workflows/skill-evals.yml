name: Skill evals

# Runs the api-bible Agent Skill eval suite (evals/) with `claude plugin eval`: real agent
# sessions with and without the skill, graded on what they produce, against the live API.
#
# Manual only, and every run waits for approval in the skill-evals environment, which holds
# the secrets. No pull_request trigger: on a same-repo PR, anyone with write access could
# edit this file and run it with the credentials. Once manual runs are consistent, the plan
# is to add back a weekly schedule (to catch model and API drift), then label-triggered PR
# runs, both through the environment.
#
# Anthropic access is Workload Identity Federation, as in our other Claude workflows: Claude
# Code exchanges the job's GitHub OIDC token itself, billed to ANTHROPIC_WORKSPACE_ID. Two
# details matter because the eval starts a fresh `claude` process for every run:
# - A GitHub OIDC token can be exchanged only once (jti) and expires in minutes, so a
#   background loop writes a fresh one to the identity-token file every 4 minutes.
# - The `default` profile turns on the shared credential cache in ANTHROPIC_CONFIG_DIR, so
#   the parallel processes reuse one exchanged Anthropic token instead of each exchanging.
#
# Start a run for a branch with `gh workflow run "Skill evals" --ref <branch>`, approve it,
# then paste the summary table into the PR (see evals/README.md).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per case per arm'
        default: '3'
      case:
        description: 'Case name glob (blank for all)'
        default: ''
      keep_temp:
        description: 'Keep each run''s sandbox (workspace + trace.jsonl) in the results artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: skill-evals
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ubuntu 24.04 runners block unprivileged user namespaces via AppArmor, which breaks
      # Claude Code's bubblewrap sandbox: every agent Bash command fails, while Write still works.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Runs inside evals/Dockerfile, the same environment as local runs: Node, Claude Code,
      # the sandbox prerequisites, and the proxy fix for Node's fetch.
      - name: Run evals
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # Not named *_KEY: the eval sandbox strips EVAL_ variables whose names contain KEY, TOKEN or SECRET.
          EVAL_API_BIBLE: ${{ secrets.API_BIBLE_EVAL_KEY }}
          RUNS: ${{ inputs.runs }}
          CASE: ${{ inputs.case }}
          KEEP_TEMP: ${{ inputs.keep_temp }}
        run: |
          dir="$RUNNER_TEMP/anthropic"; mkdir -p "$dir/configs"; chmod 700 "$dir"
          export ANTHROPIC_CONFIG_DIR="$dir" ANTHROPIC_IDENTITY_TOKEN_FILE="$dir/identity-token"
          fetch() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fapi.anthropic.com" \
              | jq -r .value > "$dir/identity-token.tmp" && mv "$dir/identity-token.tmp" "$dir/identity-token"
          }
          fetch
          (while sleep 240; do fetch; done) &
          # Turns on the shared credential cache, so parallel claude processes reuse one exchanged token.
          echo '{"version":"1.0","authentication":{"type":"oidc_federation"}}' > "$dir/configs/default.json"

          args=(--runs "$RUNS" -j 4)
          if [ -n "$CASE" ]; then args+=(--case "$CASE"); fi
          if [ "$KEEP_TEMP" = true ]; then
            args+=(--keep-temp); export SKILL_EVAL_TEMP_DIR="$PWD/evals/results/tmp"
          fi
          bash scripts/eval-skill-docker.sh "${args[@]}"
      # The same table scripts/eval-skill.sh prints at the end of every run.
      - name: Summary
        if: always()
        run: cat evals/results/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # --keep-temp seals what the plugin wrote to home/ and tmp/ in a read-only sandbox (mode
      # 000), which the upload can't read. Drop it; the workspace and trace.jsonl stay.
      - name: Drop sealed sandbox dirs
        if: always() && inputs.keep_temp
        run: |
          [ -d evals/results/tmp ] || exit 0
          chmod -R u+rwX evals/results/tmp
          find evals/results/tmp -mindepth 2 -maxdepth 2 -name sealed -type d -exec rm -rf {} +
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skill-eval-results
          path: evals/results/
          if-no-files-found: ignore
