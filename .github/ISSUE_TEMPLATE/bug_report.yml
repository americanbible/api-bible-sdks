name: Bug report
description: Something in one of the SDKs behaves incorrectly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include your api.bible key, request
        headers, or full response bodies — redact anything that looks like a
        credential before pasting.

        For a security vulnerability, stop here and report it privately instead:
        see [SECURITY.md](https://github.com/americanbible/api-bible-sdks/blob/main/SECURITY.md).

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which SDK is affected?
      options:
        - '@americanbible/api-bible-sdk (TypeScript)'
        - '@americanbible/api-bible-sdk-react (React)'
        - americanbible-api-bible-sdk (Python)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '1.1.0'
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js / Python version, and browser if relevant.
      placeholder: 'Node 20.11.0'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Include the full error message and type.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest snippet that shows the problem.
      render: text
    validations:
      required: true
